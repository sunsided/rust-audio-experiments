[package]
name = "sound"
version = "0.1.0"
edition = "2021"

[[example]]
name = "rodio_soundgen"
path = "examples/rodio_soundgen.rs"

[[example]]
name = "rodio_play"
path = "examples/rodio_play.rs"

[dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["vorbis", "playback"] }
ruststft = "0.4"
pixels = "0.17.1"
winit = { version = "0.30.13", features = ["rwh_05"] }
winit_input_helper = "0.17.0"
colorgrad = { version = "0.8.0", features = ["preset"] }
anyhow = "1.0.102"
font8x8 = "0.3.1"

[profile.dev.package.rodio]
opt-level = 3
