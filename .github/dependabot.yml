version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      gha-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      gha-major:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      cargo-major:
        applies-to: version-updates
        update-types:
          - "major"

  # Legacy Java reference sources (pom.xml) kept for porting reference only.
  # Explicitly ignore all Maven dependencies so Dependabot never opens Java PRs.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
